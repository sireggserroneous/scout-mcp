[project]
name = "scout-mcp"
version = "0.2.0"
description = "An honest, evolving web scout as an MCP server: learns per host which path through the maze ends at good information."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Pedro Paulino (Sir Eggs Erroneous)" }]
dependencies = ["mcp>=1.2", "beautifulsoup4", "markdownify", "pypdf"]

[project.optional-dependencies]
browser = ["playwright"]

[project.scripts]
scout-mcp = "scout_mcp.server:main"

[project.urls]
Homepage = "https://github.com/sireggserroneous/scout-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout_mcp"]
